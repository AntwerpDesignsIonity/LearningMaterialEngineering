name: Auto Version and Update

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  auto-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get current version
        id: get_version
        run: |
          # Extract version from package.json
          VERSION=$(cat package.json | grep '"version"' | cut -d'"' -f4)
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
      
      - name: Bump version
        id: bump_version
        run: |
          # Parse current version
          VERSION=${{ steps.get_version.outputs.current_version }}
          IFS='.' read -r -a parts <<< "$VERSION"
          MAJOR="${parts[0]}"
          MINOR="${parts[1]}"
          PATCH="${parts[2]}"
          
          # Increment patch version
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
          
          # Update package.json
          sed -i "s/\"version\": \"$VERSION\"/\"version\": \"$NEW_VERSION\"/" package.json
          
          # Update portal.html version badge
          sed -i "s/v$VERSION/v$NEW_VERSION/g" portal.html
      
      - name: Update timestamp
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M:%S UTC')
          echo "Last auto-updated: $DATE" > .last-update
          echo "Updated timestamp: $DATE"
      
      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if there are changes to commit
          if git diff --quiet; then
            echo "No version changes to commit"
          else
            git add package.json portal.html .last-update
            git commit -m "chore: auto-bump version to ${{ steps.bump_version.outputs.new_version }} [skip ci]"
            git push
          fi
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          release_name: Release v${{ steps.bump_version.outputs.new_version }}
          body: |
            ## Auto-generated Release v${{ steps.bump_version.outputs.new_version }}
            
            ### Changes
            - Automated version bump
            - Updated learning materials
            - Synchronized with repository content
            
            ### Portal Access
            Access the learning portal via:
            - Direct HTML: [portal.html](https://github.com/AntwerpDesignsIonity/LearningMaterialEngineering/blob/main/portal.html)
            - GitHub Pages (if enabled)
            
            ### Course Materials
            All course materials are organized in the `/courses` directory with the following structure:
            - **Google/Firebase** - Firebase development courses
            - **Microsoft/Azure** - Azure cloud services
            - **IoT** - Internet of Things tutorials
            - **AI** - Artificial Intelligence courses
            - **IT** - Information Technology fundamentals
            - **Engineering/Artisan** - Practical engineering skills
            
            ### License
            All materials licensed under CC BY-NC-SA 4.0
          draft: false
          prerelease: false

  deploy-pages:
    runs-on: ubuntu-latest
    needs: auto-version
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
